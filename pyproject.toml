[project]
name = "bitpilot"
version = "0.1.0"
description = "Vision-based agile flight training and deployment framework"
requires-python = ">=3.12"
dependencies = [
    "aim>=3.29.1",
    "lark>=1.3.1",
    "matplotlib>=3.10.6",
    "numpy>=2.3.2",
    "opencv-python>=4.13.0.92",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "tensorboard>=2.20.0",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "transforms3d>=0.4.2",
]

[project.scripts]
bitpilot-train = "bitpilot.train:main"
bitpilot-infer = "bitpilot.deploy.inference_node:main"
bitpilot-joy = "bitpilot.deploy.joy_target_node:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# bitpilot 包含 CUDA C++ 扩展 (bitpilot._C)，编译时必须链接 venv 内的
# torch，不能让构建后端在隔离沙箱里下载另一个 torch（ABI 会不兼容）。
no-build-isolation-package = ["bitpilot"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "preflight: 仿真环境预飞检测（需要 Gazebo 仿真运行中）",
    "flight: 飞行管线功能测试（需要 Gazebo 仿真运行中，会实际飞行）",
    "gpu: 需要 CUDA GPU",
]
addopts = "-v --tb=short -W default::UserWarning"
